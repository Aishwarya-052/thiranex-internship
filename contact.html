<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me | Jane Doe Portfolio</title>
    <meta name="description" content="Get in touch with Jane Doe for web development projects.">
    <meta name="robots" content="index, follow">
    <style>
        :root { --bg-color: #ffffff; --text-color: #212529; --primary-color: #0056b3; }
        body { font-family: system-ui, sans-serif; line-height: 1.6; margin: 0; background-color: var(--bg-color); color: var(--text-color); }
        header { border-bottom: 2px solid #eaeaea; padding: 1rem; }
        nav ul { list-style: none; padding: 0; display: flex; gap: 1.5rem; }
        nav a { color: var(--primary-color); text-decoration: none; font-weight: bold; }
        main { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; flex-direction: column; gap: 1.2rem; margin-top: 1.5rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        input, textarea { padding: 0.6rem; font-size: 1rem; border: 1px solid #767676; border-radius: 4px; }
        button { padding: 0.8rem; background-color: var(--primary-color); color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        footer { text-align: center; padding: 2rem; background-color: #f8f9fa; margin-top: 4rem; }
    </style>
</head>
<body>
    <header>
        <h1>Jane Doe</h1>
        <nav aria-label="Main Website Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html" aria-current="page">Contact Me</a></li>
            </ul>
        </nav>
    </header>
    <main id="main-content">
        <section aria-labelledby="contact-heading">
            <h2 id="contact-heading">Contact Me</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label id="label-name" for="user-name">Full Name (Required)</label>
                    <input type="text" id="user-name" name="name" required aria-labelledby="label-name">
                </div>
                <div class="form-group">
                    <label id="label-email" for="user-email">Email Address (Required)</label>
                    <input type="email" id="user-email" name="email" required aria-labelledby="label-email">
                </div>
                <div class="form-group">
                    <label id="label-message" for="user-message">Your Message (Required)</label>
                    <textarea id="user-message" name="message" rows="5" required aria-labelledby="label-message"></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Jane Doe. All rights reserved.</p>
    </footer>
</body>
</html>
