<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Thiranex Tasks</title>
    <!-- Link to your existing external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="todo-container">
    <h1>JavaScript Logic & State Management</h1>
    
    <!-- CREATE Component -->
    <form id="todo-form" class="input-group">
        <input type="text" id="todo-input" placeholder="Add a new task..." required>
        <button type="submit" class="btn-add">Add Task</button>
    </form>

    <!-- FILTER Buttons -->
    <div class="filters" id="filter-container">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <!-- READ / UPDATE / DELETE Container -->
    <ul class="todo-list" id="todo-list"></ul>
</div>

<!-- Embedded logic ensuring state management and delegated event handling work smoothly -->
<script>
    // --- STATE MANAGEMENT ---
    const defaultTodos = [
        { id: "1", text: "Setup project repository", completed: true },
        { id: "2", text: "Design HTML/CSS layout", completed: true }
    ];

    let todos = JSON.parse(localStorage.getItem('todos')) || defaultTodos;
    let currentFilter = 'all';

    if (!localStorage.getItem('todos')) {
        localStorage.setItem('todos', JSON.stringify(todos));
    }

    const todoForm = document.getElementById('todo-form');
    const todoInput = document.getElementById('todo-input');
    const todoList = document.getElementById('todo-list');
    const filterContainer = document.getElementById('filter-container');

    function saveToLocalStorage() {
        localStorage.setItem('todos', JSON.stringify(todos));
    }

    // --- RENDER FUNCTION ---
    function render() {
        todoList.innerHTML = '';

        const filteredTodos = todos.filter(todo => {
            if (currentFilter === 'active') return !todo.completed;
            if (currentFilter === 'completed') return todo.completed;
            return true;
        });

        filteredTodos.forEach(todo => {
            const li = document.createElement('li');
            li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
            li.dataset.id = todo.id;

            li.innerHTML = `
                <div class="todo-content">
                    <input type="checkbox" class="toggle-checkbox" ${todo.completed ? 'checked' : ''}>
                    <span>${todo.text}</span>
                </div>
                <div class="actions">
                    <button class="btn-edit">Edit</button>
                    <button class="btn-delete">Delete</button>
                </div>
            `;
            todoList.appendChild(li);
        });
    }

    // --- CRUD DELEGATION ---
    todoForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const taskText = todoInput.value.trim();
        if (!taskText) return;

        todos.push({ id: Date.now().toString(), text: taskText, completed: false });
        saveToLocalStorage();
        render();
        todoInput.value = '';
    });

    todoList.addEventListener('click', (e) => {
        const todoItem = e.target.closest('.todo-item');
        if (!todoItem) return;
        const id = todoItem.dataset.id;

        if (e.target.classList.contains('toggle-checkbox')) {
            todos = todos.map(todo => todo.id === id ? { ...todo, completed: e.target.checked } : todo);
            saveToLocalStorage();
            render();
        }

        if (e.target.classList.contains('btn-edit')) {
            const todo = todos.find(t => t.id === id);
            const newText = prompt('Update task name:', todo.text);
            if (newText && newText.trim()) {
                todo.text = newText.trim();
                saveToLocalStorage();
                render();
            }
        }

        if (e.target.classList.contains('btn-delete')) {
            todos = todos.filter(todo => todo.id !== id);
            saveToLocalStorage();
            render();
        }
    });

    filterContainer.addEventListener('click', (e) => {
        if (!e.target.classList.contains('filter-btn')) return;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        render();
    });

    render();
</script>
</body>
</html>
