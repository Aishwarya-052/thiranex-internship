<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="projects.html" class="active">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="main-container">
        <h2>Real-Time Weather Dashboard</h2>
        <p class="subtitle">Built with Asynchronous JavaScript & RESTful APIs</p>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>

        <div id="error-message" class="error-card hidden"></div>

        <div id="weather-result" class="weather-card hidden">
            <h3 id="city-name">--</h3>
            <div class="metric-row">
                <span>Temperature:</span>
                <strong><span id="temp">--</span>°C</strong>
            </div>
            <div class="metric-row">
                <span>Humidity:</span>
                <strong><span id="humidity">--</span>%</strong>
            </div>
            <div class="metric-row">
                <span>Wind Speed:</span>
                <strong><span id="wind-speed">--</span> m/s</strong>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
